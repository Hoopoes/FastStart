[project]
name = "faststart-main"
version = "1.0.0"
description = "Main file structure of fastAPI"
license = "MIT"
authors = [
    {name = "umar-anzar", email = "omer.anzar2@gmail.com"}
]
readme = "README.md"


requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "gunicorn>=25.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt[crypto]>=2.13.0",
    "uvicorn[standard]>=0.46.0",
]

[project.urls]
Repository = "https://github.com/Hoopoes/FastStart"

[dependency-groups]
dev = [
    "pyclean>=3.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.12",
]
